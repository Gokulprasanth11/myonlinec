<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyOnlineC — Sign In</title>
  <link rel="stylesheet" href="login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="login-bg">
    <!-- Animated code lines in background -->
    <div class="bg-code" aria-hidden="true">
      <span>#include &lt;stdio.h&gt;</span>
      <span>int main() {</span>
      <span>&nbsp;&nbsp;printf("Hello!");</span>
      <span>&nbsp;&nbsp;return 0;</span>
      <span>}</span>
      <span>#include &lt;stdlib.h&gt;</span>
      <span>int factorial(int n) {</span>
      <span>&nbsp;&nbsp;if (n &lt;= 1) return 1;</span>
      <span>&nbsp;&nbsp;return n * factorial(n-1);</span>
      <span>}</span>
    </div>
  </div>

  <div class="login-wrapper">
    <div class="login-card">
      <!-- Logo -->
      <div class="login-logo">
        <div class="logo-badge">C</div>
        <div class="logo-text">MyOnline<span class="highlight">C</span></div>
      </div>
      <p class="login-subtitle">Online C IDE &amp; Compiler</p>

      <!-- Form -->
      <form id="login-form" autocomplete="off" novalidate>
        <div class="field-group">
          <label for="username">Username</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input type="text" id="username" name="username" placeholder="Enter username"
                   autocomplete="username" spellcheck="false" required />
          </div>
        </div>

        <div class="field-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" id="password" name="password" placeholder="Enter password"
                   autocomplete="current-password" required />
            <button type="button" id="toggle-pw" class="pw-toggle" title="Show/hide password">
              <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div id="login-error" class="login-error hidden"></div>

        <button type="submit" id="sign-in-btn" class="sign-in-btn">
          <span id="btn-label">Sign In</span>
          <span id="btn-spinner" class="spinner hidden"></span>
        </button>
      </form>

      <div class="login-footer">
        <span class="dot"></span> Secure session &nbsp;·&nbsp; VS Code dark theme
      </div>
    </div>
  </div>

  <script>
    (function () {
      // A saved token cannot authorize page loads by itself. Ask the server to
      // set the session cookie again, and only then open the IDE.
      const savedToken = localStorage.getItem('myonlinec_token');
      if (savedToken) {
        fetch('/api/auth/refresh', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${savedToken}` }
        }).then((res) => {
          if (res.ok) {
            window.location.replace('/');
            return;
          }
          localStorage.removeItem('myonlinec_token');
          localStorage.removeItem('myonlinec_user');
        }).catch(() => {});
      }

      const form      = document.getElementById('login-form');
      const errBox    = document.getElementById('login-error');
      const signInBtn = document.getElementById('sign-in-btn');
      const btnLabel  = document.getElementById('btn-label');
      const spinner   = document.getElementById('btn-spinner');
      const pwInput   = document.getElementById('password');
      const togglePw  = document.getElementById('toggle-pw');

      // Toggle password visibility
      togglePw.addEventListener('click', () => {
        const isText = pwInput.type === 'text';
        pwInput.type = isText ? 'password' : 'text';
        document.getElementById('eye-icon').innerHTML = isText
          ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'
          : '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>'
            + '<path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>'
            + '<line x1="1" y1="1" x2="23" y2="23"/>';
      });

      function showError(msg) {
        errBox.textContent = msg;
        errBox.classList.remove('hidden');
        signInBtn.disabled = false;
        btnLabel.classList.remove('hidden');
        spinner.classList.add('hidden');
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errBox.classList.add('hidden');
        signInBtn.disabled = true;
        btnLabel.classList.add('hidden');
        spinner.classList.remove('hidden');

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        if (!username || !password) {
          showError('Please enter both username and password.');
          return;
        }

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });
          const data = await res.json();

          if (data.success && data.token) {
            localStorage.setItem('myonlinec_token', data.token);
            localStorage.setItem('myonlinec_user', username);
            window.location.replace('/');
          } else {
            showError(data.error || 'Login failed. Please try again.');
          }
        } catch (err) {
          showError('Network error. Make sure the server is running.');
        }
      });

      // Auto-focus username
      document.getElementById('username').focus();
    })();
  </script>
</body>
</html>
