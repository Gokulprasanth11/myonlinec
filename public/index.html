<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyOnlineC - C IDE</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Segoe+UI:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codicons/0.0.36/codicon.min.css">
</head>
<body class="vscode-dark">
  <div class="workbench">
    <!-- Top Header Bar -->
    <header class="titlebar">
      <div class="titlebar-left">
        <div class="app-logo">
          <span class="logo-badge">C</span>
          <span class="logo-text">MyOnline<span class="highlight">C</span></span>
        </div>
      </div>

      <div class="titlebar-center">
        <div class="quick-selectors">
          <div class="select-wrapper">
            <span class="select-label">Template:</span>
            <select id="sample-select" title="Load sample project">
              <option value="folders_project">Project with Folders (include/ & src/)</option>
              <option value="hello">Hello, World!</option>
              <option value="multi_file">Multi-File (main.c + math_utils.h)</option>
              <option value="ldd_inspect">Inspect Dynamic Libraries (ldd)</option>
              <option value="sum">Sum of Two Numbers (stdin)</option>
              <option value="fibonacci">Fibonacci Series</option>
              <option value="pointers">Pointers & Memory</option>
              <option value="bubble_sort">Bubble Sort</option>
            </select>
          </div>
          <div class="select-wrapper">
            <span class="select-label">Compiler:</span>
            <select id="compiler-select" title="Target compiler">
              <option value="gcc-15" selected>GCC 15 (C)</option>
              <option value="clang-21">Clang 21 (C)</option>
            </select>
          </div>
        </div>
      </div>

      <div class="titlebar-right">
        <button id="download-btn" class="titlebar-btn" title="Export Current File">
          <i class="codicon codicon-cloud-download"></i>
          <span>Export</span>
        </button>
        <button id="run-btn" class="titlebar-btn run-btn" title="Run Code (Ctrl + Enter)">
          <i class="codicon codicon-play"></i>
          <span>Run</span>
          <span class="keybinding">Ctrl+↵</span>
        </button>
      </div>
    </header>

    <!-- Main Workspace Area -->
    <div class="workbench-body">
      <!-- File Explorer Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <span class="sidebar-title">EXPLORER</span>
          <div class="sidebar-actions">
            <button id="btn-new-file" class="action-btn" title="New File">
              <i class="codicon codicon-new-file"></i>
            </button>
            <button id="btn-new-folder" class="action-btn" title="New Folder">
              <i class="codicon codicon-new-folder"></i>
            </button>
          </div>
        </div>

        <!-- File Tree -->
        <div class="file-tree" id="file-tree">
          <!-- Dynamic tree nodes rendered by app.js -->
        </div>
      </aside>

      <!-- Main Editor & Terminal Area -->
      <main class="editor-area">
        <!-- Editor Tabs -->
        <div class="tabs-and-actions">
          <div class="tabs-bar" id="editor-tabs">
            <!-- Dynamic tabs rendered by app.js -->
          </div>
          <div class="editor-tab-actions">
            <button id="format-btn" class="action-btn" title="Format Document (Shift+Alt+F)">
              <i class="codicon codicon-symbol-keyword"></i>
              <span>Format</span>
            </button>
            <button id="copy-code-btn" class="action-btn" title="Copy Content">
              <i class="codicon codicon-copy"></i>
              <span>Copy</span>
            </button>
          </div>
        </div>

        <!-- Breadcrumbs -->
        <div class="breadcrumbs" id="breadcrumbs">
          <span class="crumb root-crumb">myonlinec</span>
          <span class="crumb-separator">›</span>
          <span class="crumb active-crumb" id="active-crumb">main.c</span>
        </div>

        <!-- Monaco Editor Viewport -->
        <div class="editor-viewport" id="editor-viewport">
          <div id="monaco-container" class="monaco-container"></div>
          <textarea id="fallback-editor" spellcheck="false" class="fallback-editor"></textarea>
        </div>

        <!-- Bottom Panel (Terminal & Input) -->
        <div class="bottom-panel" id="bottom-panel">
          <div class="panel-header">
            <div class="panel-tabs">
              <button class="panel-tab active" data-tab="terminal">
                <i class="codicon codicon-terminal"></i>
                <span>TERMINAL</span>
              </button>
              <button class="panel-tab" data-tab="input">
                <i class="codicon codicon-edit"></i>
                <span>INPUT (STDIN)</span>
              </button>
            </div>

            <div class="panel-meta" id="panel-meta">
              <span id="metric-status" class="meta-badge">Ready</span>
              <span id="metric-time" class="meta-item"></span>
              <span id="metric-memory" class="meta-item"></span>
            </div>

            <div class="panel-actions">
              <button id="clear-terminal-btn" class="action-btn" title="Clear Terminal">
                <i class="codicon codicon-clear-all"></i>
                <span>Clear</span>
              </button>
            </div>
          </div>

          <div class="panel-content">
            <!-- Terminal Tab Content -->
            <div class="tab-pane active" id="pane-terminal">
              <pre id="output-terminal" class="terminal-text"><span class="terminal-placeholder">Ready. Click "Run" or press [Ctrl + Enter] to compile and execute your code.</span></pre>
            </div>

            <!-- Input Tab Content -->
            <div class="tab-pane" id="pane-input">
              <textarea id="stdin-input" class="stdin-box" placeholder="Type standard input here (stdin) for programs using scanf(), getchar(), etc."></textarea>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Status Bar -->
    <footer class="statusbar">
      <div class="statusbar-left">
        <div class="status-item" id="status-status-text">
          <i class="codicon codicon-check"></i>
          <span>Ready</span>
        </div>
      </div>

      <div class="statusbar-right">
        <div class="status-item" id="status-cursor">Ln 1, Col 1</div>
        <div class="status-item">UTF-8</div>
        <div class="status-item status-lang">
          <i class="codicon codicon-code"></i>
          <span id="status-lang-text">C</span>
        </div>
        <div class="status-item compiler-status" title="Current Compiler Engine">
          <i class="codicon codicon-server"></i>
          <span id="status-compiler-text">GCC 15</span>
        </div>
      </div>
    </footer>
  </div>

  <!-- Monaco Editor Loader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
